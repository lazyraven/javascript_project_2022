  /* ============ Text -> HTML rendering for answers ============ */
  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  const strongCodeRe = /(^\s*(async\s+function|function\b|const\b|let\b|var\b|class\s|if\s*\(|else\b|for\s*\(|while\s*\(|return\b|import\s|export\s|console\.|catch\s*\(|try\s*\{?|switch\s*\(|new\s\w+\()|\/\/|=>|;\s*$|^\s*[\}\)][;,]?\s*$|^\s*[\{\[]|^\s*\|.*\|\s*$)/;
  function isLabelLine(line) {
    const t = line.trim();
    return /^[A-Z][A-Za-z0-9 /&()\-]{1,38}:$/.test(t) && t.split(' ').length <= 6;
  }
  function isBulletLine(line) {
    const t = line.trim();
    return /^(•|\*|-|👉)\s+/.test(t) || /^\d+\.\s+/.test(t);
  }
  function leadingSpaces(line) {
    const m = line.match(/^[ \t]*/);
    return m ? m[0].replace(/\t/g,'    ').length : 0;
  }
  function renderProseLines(lines) {
    let paraBuf = [], bulletBuf = [];
    let html = '';
    const flushPara = () => { if (paraBuf.length) { html += '<p class="answer-text">' + paraBuf.join('<br>') + '</p>'; paraBuf=[]; } };
    const flushBullets = () => { if (bulletBuf.length) { html += '<ul class="answer-list">' + bulletBuf.map(b=>'<li>'+b+'</li>').join('') + '</ul>'; bulletBuf=[]; } };
    lines.forEach(line => {
      const t = line.trim();
      if (!t) { flushPara(); flushBullets(); return; }
      if (isLabelLine(line)) {
        flushPara(); flushBullets();
        html += '<div class="answer-label">' + escapeHtml(t) + '</div>';
      } else if (isBulletLine(line)) {
        flushPara();
        bulletBuf.push(escapeHtml(t.replace(/^(•|\*|-|👉)\s+/,'').replace(/^\d+\.\s+/,'')));
      } else {
        flushBullets();
        paraBuf.push(escapeHtml(t));
      }
    });
    flushPara(); flushBullets();
    return html;
  }
  function renderDefinition(raw) {
    if (!raw || !raw.trim()) return '<p class="answer-empty">No answer added yet — edit the DATA array to fill this in.</p>';
    const blocks = raw.replace(/\r\n/g,'\n').split(/\n\s*\n/)
      .map(b => b.split('\n').filter(l => l.trim().length > 0))
      .filter(b => b.length > 0);
    let html = '';
    blocks.forEach(lines => {
      const runs = [];
      lines.forEach(line => {
        const deep = leadingSpaces(line) >= 4;
        if (runs.length && runs[runs.length-1].deep === deep) {
          runs[runs.length-1].lines.push(line);
        } else {
          runs.push({ deep, lines: [line] });
        }
      });
      runs.forEach(run => {
        const matches = run.lines.filter(l => strongCodeRe.test(l)).length;
        const ratio = matches / run.lines.length;
        const threshold = run.deep ? 0.4 : 0.6;
        if (ratio >= threshold) {
          html += '<pre class="code-block">' + escapeHtml(run.lines.map(l => l.replace(/^ {0,4}/, '')).join('\n').trimEnd()) + '</pre>';
        } else {
          html += renderProseLines(run.lines);
        }
      });
    });
    return html;
  }

  /* ============ State ============ */
  const catByKey = {};
  CATEGORIES.forEach(c => catByKey[c.key] = c);

  const STORAGE_KEY = 'jsRevisionProgress_v1';
  let revised = {};
  try { revised = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { revised = {}; }

  let activeCategory = 'all';
  let searchTerm = '';
  let hideRevised = false;

  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(revised)); } catch(e) {}
  }

  /* ============ Build DOM ============ */
  const sectionsContainer = document.getElementById('sectionsContainer');
  const categoryChips = document.getElementById('categoryChips');
  const progressTrack = document.getElementById('progressTrack');
  const progressLegend = document.getElementById('progressLegend');
  const progressCount = document.getElementById('progressCount');
  const resultsNote = document.getElementById('resultsNote');

  const grouped = {};
  CATEGORIES.forEach(c => grouped[c.key] = []);
  DATA.forEach(item => { if (grouped[item.category]) grouped[item.category].push(item); });

  // Category chips
  function buildChips() {
    const allChip = document.createElement('div');
    allChip.className = 'chip active';
    allChip.dataset.key = 'all';
    allChip.innerHTML = '<span class="dot" style="background:var(--brand)"></span>All (' + DATA.length + ')';
    allChip.addEventListener('click', () => setActiveCategory('all'));
    categoryChips.appendChild(allChip);

    CATEGORIES.forEach(cat => {
      const count = grouped[cat.key].length;
      if (!count) return;
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.dataset.key = cat.key;
      chip.style.setProperty('--chip-color', cat.color);
      chip.innerHTML = '<span class="dot" style="background:' + cat.color + '"></span>' + cat.label + ' (' + count + ')';
      chip.addEventListener('click', () => setActiveCategory(cat.key));
      categoryChips.appendChild(chip);
    });
  }

  function setActiveCategory(key) {
    activeCategory = key;
    [...categoryChips.children].forEach(chip => {
      chip.classList.toggle('active', chip.dataset.key === key);
    });
    applyFilters();
  }

  // Sections + cards
  function buildSections() {
    CATEGORIES.forEach(cat => {
      const items = grouped[cat.key];
      if (!items.length) return;

      const section = document.createElement('section');
      section.className = 'category-section';
      section.dataset.category = cat.key;

      const heading = document.createElement('div');
      heading.className = 'section-heading';
      heading.style.setProperty('--sec-color', cat.color);
      heading.innerHTML = '<span class="dot"></span><h2>' + cat.label + '</h2><span class="sec-count" data-role="sec-count"></span>';
      section.appendChild(heading);

      items.forEach(item => {
        section.appendChild(buildCard(item, cat));
      });

      sectionsContainer.appendChild(section);
    });

    const emptyState = document.createElement('div');
    emptyState.className = 'empty-state';
    emptyState.id = 'emptyState';
    emptyState.style.display = 'none';
    emptyState.textContent = 'No questions match your search or filters.';
    sectionsContainer.appendChild(emptyState);
  }

  function buildCard(item, cat) {
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'q-' + item.id;
    card.style.setProperty('--card-color', cat.color);
    card.dataset.id = item.id;
    card.dataset.category = item.category;
    card.dataset.search = (item.question + ' ' + item.definition).toLowerCase();

    const isRevised = !!revised[item.id];
    if (isRevised) card.classList.add('is-revised');

    const head = document.createElement('div');
    head.className = 'qcard-head';

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'qcheck';
    check.checked = isRevised;
    check.title = 'Mark as revised';
    check.addEventListener('click', (e) => e.stopPropagation());
    check.addEventListener('change', () => {
      revised[item.id] = check.checked;
      card.classList.toggle('is-revised', check.checked);
      saveProgress();
      updateProgress();
      applyFilters();
    });

    const main = document.createElement('div');
    main.className = 'qcard-main';
    main.innerHTML =
      '<div class="qcard-top-row">' +
        '<span class="qnum">Q' + item.id + '</span>' +
        '<span class="qtext">' + escapeHtml(item.question) + '</span>' +
        '<span class="qbadge">' + cat.label + '</span>' +
      '</div>';

    const chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.innerHTML = '▾';

    head.appendChild(check);
    head.appendChild(main);
    head.appendChild(chevron);
    head.addEventListener('click', () => card.classList.toggle('open'));

    const body = document.createElement('div');
    body.className = 'qcard-body';
    const bodyInner = document.createElement('div');
    bodyInner.className = 'qcard-body-inner';
    bodyInner.innerHTML = renderDefinition(item.definition);
    body.appendChild(bodyInner);

    card.appendChild(head);
    card.appendChild(body);
    return card;
  }

  /* ============ Progress bar ============ */
  function updateProgress() {
    const total = DATA.length;
    const revisedCount = DATA.filter(d => revised[d.id]).length;
    progressCount.textContent = revisedCount + ' / ' + total + ' revised';

    progressTrack.innerHTML = '';
    progressLegend.innerHTML = '';

    CATEGORIES.forEach(cat => {
      const items = grouped[cat.key];
      if (!items.length) return;
      const catRevised = items.filter(d => revised[d.id]).length;
      const widthPct = (items.length / total) * 100;
      const fillPct = (catRevised / items.length) * 100;

      const seg = document.createElement('div');
      seg.className = 'progress-seg';
      seg.style.setProperty('--seg-color', cat.color);
      seg.style.width = widthPct + '%';
      seg.title = cat.label + ': ' + catRevised + '/' + items.length + ' revised';
      seg.innerHTML = '<div class="rest"></div><div class="fill" style="--fill-pct:' + fillPct + '%"></div>';
      progressTrack.appendChild(seg);

      const legendItem = document.createElement('span');
      legendItem.style.setProperty('--dot-color', cat.color);
      legendItem.innerHTML = '<span class="legend-dot"></span>' + cat.label.split(' ')[0] + ' ' + catRevised + '/' + items.length;
      progressLegend.appendChild(legendItem);
    });
  }

  /* ============ Filters ============ */
  function applyFilters() {
    searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
    let visibleCount = 0;

    CATEGORIES.forEach(cat => {
      const section = sectionsContainer.querySelector('.category-section[data-category="' + cat.key + '"]');
      if (!section) return;
      const catMatches = activeCategory === 'all' || activeCategory === cat.key;

      let sectionVisibleCount = 0;
      section.querySelectorAll('.qcard').forEach(card => {
        const id = Number(card.dataset.id);
        const matchesSearch = !searchTerm || card.dataset.search.includes(searchTerm);
        const matchesRevised = !hideRevised || !revised[id];
        const show = catMatches && matchesSearch && matchesRevised;
        card.classList.toggle('hidden-item', !show);
        if (show) sectionVisibleCount++;
      });

      section.classList.toggle('is-empty', sectionVisibleCount === 0);
      const countEl = section.querySelector('[data-role="sec-count"]');
      if (countEl) countEl.textContent = sectionVisibleCount + ' shown';
      visibleCount += sectionVisibleCount;
    });

    document.getElementById('emptyState').style.display = visibleCount === 0 ? 'block' : 'none';

    if (searchTerm || activeCategory !== 'all' || hideRevised) {
      resultsNote.textContent = visibleCount + ' of ' + DATA.length + ' questions shown';
    } else {
      resultsNote.textContent = '';
    }
  }

  /* ============ Controls wiring ============ */
  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('clearSearchBtn').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    applyFilters();
  });
  document.getElementById('hideRevisedToggle').addEventListener('change', (e) => {
    hideRevised = e.target.checked;
    applyFilters();
  });
  document.getElementById('expandAllBtn').addEventListener('click', () => {
    document.querySelectorAll('.qcard').forEach(c => c.classList.add('open'));
  });
  document.getElementById('collapseAllBtn').addEventListener('click', () => {
    document.querySelectorAll('.qcard').forEach(c => c.classList.remove('open'));
  });

  /* ============ Back to top ============ */
  const backToTopBtn = document.getElementById('backToTopBtn');
  window.addEventListener('scroll', () => {
    backToTopBtn.style.display = (window.scrollY > 300) ? 'block' : 'none';
  });
  backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  /* ============ Theme toggle ============ */
  const themeToggle = document.getElementById('themeToggle');
  const bodyEl = document.body;
  function enableLightMode(save) {
    bodyEl.classList.add('light-mode');
    themeToggle.innerHTML = '🌙 Dark';
    if (save) localStorage.setItem('theme', 'light');
  }
  function enableDarkMode(save) {
    bodyEl.classList.remove('light-mode');
    themeToggle.innerHTML = '☀️ Light';
    if (save) localStorage.setItem('theme', 'dark');
  }
  if (localStorage.getItem('theme') === 'light') { enableLightMode(false); } else { enableDarkMode(false); }
  themeToggle.addEventListener('click', () => {
    if (bodyEl.classList.contains('light-mode')) { enableDarkMode(true); } else { enableLightMode(true); }
  });

  /* ============ Init ============ */
  buildChips();
  buildSections();
  updateProgress();
  applyFilters();
</script>
</body>
</html>
