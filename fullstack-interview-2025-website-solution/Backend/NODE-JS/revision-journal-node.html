<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="https://img.icons8.com/?size=100&id=hsPbhkOH4FMe&format=png&color=000000">
<title>Node.js Interview Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f17;
    --bg-elevated:#111726;
    --bg-card:#141b2d;
    --bg-card-hover:#182036;
    --border:#232c42;
    --border-soft:#1a2236;
    --text:#e7ebf3;
    --text-dim:#8b96ad;
    --text-faint:#5c6883;
    --accent:#5eead4;
    --accent-strong:#2dd4bf;
    --accent-soft:rgba(94,234,212,0.12);
    --warn:#fbbf24;
    --warn-soft:rgba(251,191,36,0.12);
    --danger:#fb7185;
    --danger-soft:rgba(251,113,133,0.12);
    --info:#7dd3fc;
    --info-soft:rgba(125,211,252,0.12);
    --shadow:0 8px 24px rgba(0,0,0,0.35);
    --radius:12px;
    --mono:'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, monospace;
    --sans:'Inter', "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }

  body.light-mode{
    --bg:#f4f6fb;
    --bg-elevated:#ffffff;
    --bg-card:#ffffff;
    --bg-card-hover:#f7f9fd;
    --border:#dde2ee;
    --border-soft:#e7ebf4;
    --text:#141a2b;
    --text-dim:#5b6478;
    --text-faint:#8791a6;
    --accent:#0f9488;
    --accent-strong:#0d7a70;
    --accent-soft:rgba(15,148,136,0.10);
    --warn:#b45309;
    --warn-soft:rgba(180,83,9,0.10);
    --danger:#be123c;
    --danger-soft:rgba(190,18,60,0.08);
    --info:#0369a1;
    --info-soft:rgba(3,105,161,0.08);
    --shadow:0 6px 20px rgba(20,26,43,0.08);
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    transition:background-color .3s ease, color .3s ease;
    padding-bottom:60px;
  }

  .app{
    max-width:900px;
    margin:0 auto;
    padding:22px 18px 60px;
  }

  /* ===== Top bar (editor-tab styled header) ===== */
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 18px;
    box-shadow:var(--shadow);
  }

  .window-dots{ display:flex; gap:6px; flex-shrink:0; }
  .window-dots span{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .window-dots span:nth-child(1){ background:#fb7185; }
  .window-dots span:nth-child(2){ background:#fbbf24; }
  .window-dots span:nth-child(3){ background:#34d399; }

  .titles{ flex:1; min-width:0; }
  .titles h1{
    font-family:var(--mono);
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.02em;
  }
  .titles p{
    margin:3px 0 0;
    font-size:12.5px;
    color:var(--text-dim);
    font-family:var(--mono);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .theme-toggle{
    flex-shrink:0;
    background:var(--bg-card);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:.2s ease;
  }
  .theme-toggle:hover{ border-color:var(--accent); color:var(--accent); }

  /* ===== Resource links ===== */
  .resources{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin:14px 2px 0;
  }
  .resources a{
    color:var(--text-dim);
    font-size:13px;
    text-decoration:none;
    border-bottom:1px dashed var(--border);
    width:fit-content;
    padding-bottom:1px;
    transition:.2s ease;
  }
  .resources a:hover{ color:var(--accent); border-color:var(--accent); }

  /* ===== Controls ===== */
  .controls{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .search-wrap input{
    width:100%;
    background:var(--bg-card);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 14px;
    font-size:14.5px;
    font-family:var(--sans);
    outline:none;
    transition:.2s ease;
  }
  .search-wrap input::placeholder{ color:var(--text-faint); }
  .search-wrap input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--bg-card);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-size:12.5px;
    font-weight:600;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:.2s ease;
    font-family:var(--mono);
  }
  .chip .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .chip:hover{ border-color:var(--accent); color:var(--text); }
  .chip.active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--text);
  }
  .chip .count{ opacity:0.65; font-weight:500; }

  .toolbar-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    font-size:13px;
    color:var(--text-dim);
  }
  .pending-toggle{
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
    user-select:none;
  }
  .pending-toggle input{ accent-color:var(--accent-strong); width:15px; height:15px; cursor:pointer; }

  .bulk-actions{ display:flex; gap:8px; }
  .bulk-actions button{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:6px 10px;
    border-radius:8px;
    font-size:12.5px;
    cursor:pointer;
    transition:.2s ease;
  }
  .bulk-actions button:hover{ border-color:var(--accent); color:var(--accent); }

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--accent-strong), var(--accent));
    border-radius:999px;
    transition:width .4s ease;
  }
  #progressLabel{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--text-dim);
    white-space:nowrap;
  }

  /* ===== Category section headers ===== */
  .category-section{ margin-top:26px; }
  .category-heading{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:var(--mono);
    font-size:13px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 10px 2px;
  }
  .category-heading .dot{ width:8px; height:8px; border-radius:50%; }
  .category-heading .cat-count{ color:var(--text-faint); font-weight:500; text-transform:none; }

  /* ===== Question cards ===== */
  .question-list{ margin-top:8px; }

  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
    transition:border-color .3s ease, box-shadow .3s ease, background-color .3s ease;
  }
  .card:hover{ background:var(--bg-card-hover); }
  .card.revised{ border-color:var(--accent); }
  .card.highlight{ box-shadow:0 0 0 3px var(--accent-soft); }

  .card-header{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    background:none;
    border:none;
    text-align:left;
    padding:14px 16px;
    cursor:pointer;
    color:var(--text);
    font-family:var(--sans);
  }

  .q-index{
    font-family:var(--mono);
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
    padding:3px 8px;
    border-radius:6px;
    flex-shrink:0;
  }

  .q-text{
    flex:1;
    font-size:14.5px;
    font-weight:600;
    line-height:1.4;
  }

  .revised-dot{
    flex-shrink:0;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--border);
    transition:background-color .2s ease;
  }
  .card.revised .revised-dot{ background:var(--accent-strong); }

  .chevron{
    flex-shrink:0;
    color:var(--text-faint);
    font-size:12px;
    transition:transform .25s ease;
  }
  .card.open .chevron{ transform:rotate(180deg); }

  .card-body{
    padding:0 16px 16px;
    border-top:1px solid var(--border-soft);
  }

  .definition{
    font-family:var(--mono);
    font-size:13px;
    line-height:1.65;
    color:var(--text-dim);
    background:var(--bg);
    border:1px solid var(--border-soft);
    border-radius:8px;
    padding:14px 16px;
    margin:14px 0 0;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-x:auto;
  }
  body.light-mode .definition{ background:#f7f9fc; }

  .definition .l-good{ color:var(--accent-strong); font-weight:600; }
  .definition .l-bad{ color:var(--danger); font-weight:600; }
  .definition .l-note{ color:var(--info); font-weight:600; }
  .definition .l-warn{ color:var(--warn); font-weight:600; }
  .definition strong{ color:var(--text); }

  .card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
    gap:10px;
    flex-wrap:wrap;
  }

  .revised-toggle{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    color:var(--text-dim);
    cursor:pointer;
    user-select:none;
  }
  .revised-toggle input{ accent-color:var(--accent-strong); width:15px; height:15px; cursor:pointer; }

  .category-tag{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-faint);
    border:1px solid var(--border);
    padding:3px 9px;
    border-radius:999px;
  }

  .no-results{
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    margin-top:40px;
  }

  /* ===== Back to top ===== */
  #backToTopBtn{
    display:none;
    position:fixed;
    bottom:24px;
    right:24px;
    background:var(--accent-strong);
    color:#04120f;
    border:none;
    border-radius:50%;
    width:46px;
    height:46px;
    font-size:19px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    z-index:1000;
    transition:transform .2s ease;
  }
  #backToTopBtn:hover{ transform:scale(1.08); }

  @media (max-width:600px){
    .titles h1{ font-size:16.5px; }
    .titles p{ font-size:11px; }
    .app{ padding:16px 12px 50px; }
    .q-text{ font-size:13.5px; }
    .definition{ font-size:12.3px; }
  }
</style>
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="window-dots"><span></span><span></span><span></span></div>

    <section class="controls">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search questions & answers…" autocomplete="off" />
      </div>

        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span id="progressLabel">0 / 0 revised</span>
      </div>
    </section>

    <main id="questionList" class="question-list"></main>
    <p id="noResults" class="no-results" hidden>No questions match your search / filter.</p>

  </div>

  <button id="backToTopBtn" title="Back to top">↑</button>

  <script>
    // =========================================================
    // 1) CATEGORIES — edit label/color here if you add new topics
    // =========================================================
    const CATEGORIES = [
      { id: "basics",    label: "Node.js Basics",      color: "#5eead4" },
      { id: "structure", label: "Project Structure",   color: "#7dd3fc" },
      { id: "async",     label: "Async & Event Loop",  color: "#fbbf24" },
      { id: "express",   label: "Express & APIs",      color: "#c4b5fd" },
      { id: "database",  label: "Database",            color: "#34d399" },
      { id: "other",     label: "Networking & Tools",  color: "#fb7185" },
    ];

    // =========================================================
    // 2) QUESTION DATA
    // To add a new question later: copy an object below and fill
    // in { category, question, definition }. It will show up
    // automatically — no other code needs to change.
    // Blank / empty stub objects are ignored by the renderer, so
    // you can keep placeholders here while you're drafting.
    // =========================================================
    const nodeQuestions = [
      {
        category: "basics",
        question: "(Basic) — What is Node.js?",
        definition: `Node.js is a JavaScript runtime.
Normally JavaScript runs only inside a web browser.

Node.js allows JavaScript to run outside the browser, such as:

    • Backend servers
    • APIs
    • Command-line tools
    • Automation scripts

Without Node.js, you cannot run a backend project written in JavaScript.

Folder Structure:
backend/
│
├── node_modules/
├── src/
│   ├── config/
│   ├── controllers/
│   ├── middleware/
│   ├── models/
│   ├── routes/
│   ├── services/
│   ├── utils/
│   └── app.js
│
├── .env
├── .gitignore
├── package.json
├── package-lock.json
├── server.js
└── README.md

Node.js is an open-source, cross-platform runtime environment that executes JavaScript code outside the browser.

It uses an event-driven, non-blocking I/O model, which makes it efficient and suitable
for building scalable network applications like APIs and real-time apps.

✔️ Key Points to Mention (if interviewer asks more):
    • Uses V8 engine (same as Chrome)
    • Single-threaded but handles multiple requests using event loop
    • Best for:
        - APIs
        - Real-time apps (chat, streaming)
    • Not ideal for:
        - CPU-heavy tasks`
      },
      {
        category: "structure",
        question: "config/ ?",
        definition: `Purpose: Stores configuration files.

Examples:
    • Database connection
    • Environment configuration
    • Third-party service setup

Example files:
    db.js
    config.js`
      },
      {
        category: "structure",
        question: "middleware/ ?",
        definition: `src/
  └── middleware/

Purpose: Middleware runs before a request reaches the controller.

Examples:
    • Authentication
    • Logging
    • Error handling
    • Request validation

Example files:
    authMiddleware.js
    logger.js
    errorHandler.js`
      },
      {
        category: "structure",
        question: "models/ ?",
        definition: `Purpose: Defines how your data is structured.
When using MongoDB with Mongoose, you'll create schemas here.

Example:
    User.js
    Product.js`
      },
      {
        category: "structure",
        question: "routes/ ?",
        definition: `Purpose: Defines API endpoints.

Example:
    GET /users
    POST /users
    PUT /users/:id
    DELETE /users/:id

Example file: userRoutes.js
Routes call controllers to handle requests.`
      },
      {
        category: "structure",
        question: "services/ ?",
        definition: `Purpose: Contains business logic.
Instead of writing all logic inside controllers, move complex operations into services.

Example: userService.js
    It might:
    • Create a user
    • Send an email
    • Validate business rules`
      },
      {
        category: "structure",
        question: "utils/ ?",
        definition: `src/
  └── utils/

Purpose: Stores reusable helper functions.

Examples:
    logger.js
    deepClone.js
    formatDate.js
    generateToken.js`
      },
      {
        category: "structure",
        question: "app.js ?",
        definition: `Purpose: Configures the Express application.

Typical responsibilities:
    • Create the Express app
    • Register middleware
    • Register routes
    • Export the app

It does not start the server.`
      },
      {
        category: "structure",
        question: "server.js ?",
        definition: `Purpose: This is the application's entry point.

Responsibilities:
    • Import the Express app
    • Start listening on a port

Example:
    const app = require("./src/app");

    app.listen(3000, () => {
      console.log("Server is running on port 3000");
    });

We'll write this code in a later step.`
      },
      {
        category: "structure",
        question: ".env ?",
        definition: `Purpose: Stores environment variables.

Examples:
    PORT=3000
    MONGO_URI=your_database_url
    JWT_SECRET=your_secret_key

⚠️ Important: Never commit sensitive values to Git.`
      },
      {
        category: "structure",
        question: ".gitignore ?",
        definition: `Purpose: Tells Git which files or folders to ignore.

Typical contents:
    node_modules/
    .env`
      },
      {
        category: "structure",
        question: "README.md ?",
        definition: `Purpose: Describes the project.

It usually includes:
    Project overview
    Installation steps
    Available scripts
    API information`
      },
      {
        category: "structure",
        question: "node_modules/ ?",
        definition: `Purpose: Contains all installed npm packages.

⚠️ Important: You should never edit files inside node_modules.
It is automatically created when you install dependencies.`
      },
      {
        category: "structure",
        question: "package-lock.json ?",
        definition: `Purpose: Automatically generated by npm.
It records the exact versions of installed packages to ensure consistent installations across different machines.`
      },
      {
        category: "structure",
        question: "Create the folder structure — command?",
        definition: `mkdir config controllers middleware models routes services utils`
      },
      {
        category: "structure",
        question: "Controllers in Node.js?",
        definition: `In a Node.js project (especially with Express.js), the controller folder contains the business logic for handling requests and responses.
It sits between the routes and the services/models.

    - controllers/
        - user.controller.js`
      },
      {
        category: "structure",
        question: "Setup — create the middleware file",
        definition: `mkdir middleware
Inside it, create a file:
    touch middleware/auth.middleware.js`
      },
      {
        category: "async",
        question: "(Basic → Core Concept) — Why is Node.js single-threaded but still able to handle multiple requests efficiently?",
        definition: `Node.js is single-threaded but uses an event-driven architecture with a non-blocking I/O model.
When a request involves operations like database access or file handling,
Node.js offloads those tasks to the system and registers a callback.
Once the task is completed, the callback is placed in the event queue and executed by the event loop.
This allows Node.js to handle multiple requests concurrently without creating multiple threads.

✔️ Easy Analogy (Use if needed)
Think of it like a waiter in a restaurant:
    Takes order → sends to kitchen → moves to next table
    Doesn't wait for food to be ready
    Comes back when food is done

✔️ Key Terms to Mention
    • Event Loop
    • Non-blocking I/O
    • Callback queue
    • Asynchronous processing

✔️ Bonus Tip (Impress Interviewer):
"Although Node.js is single-threaded, it internally uses a thread pool (via libuv)
for handling certain operations like file system tasks."

✔️ Common Mistake to Avoid
❌ Saying "Node.js handles everything in one thread"
✔️ Correct: It uses one main thread but offloads tasks internally`
      },
      {
        category: "async",
        question: "(This is very important) — What is the Event Loop in Node.js?",
        definition: `The event loop is the core of Node.js's asynchronous architecture.
It continuously monitors the call stack and callback queue.
If the call stack is empty, it takes the first callback from the queue and pushes it to the stack for execution.
This process allows Node.js to handle multiple asynchronous operations efficiently without blocking the main thread.

✔️ How It Works (Step-by-Step)
    1. Code runs → goes into Call Stack
    2. Async task (like API call, setTimeout) → sent to background
    3. Once completed → callback moves to Callback Queue
    4. Event loop checks: if stack is empty → pushes callback to stack
    5. Executes callback

✔️ Important Queues in Node.js
    • Callback Queue (macrotasks)
    • Microtask Queue (Promises, process.nextTick)

👉 Microtasks run before callback queue (important detail)
    console.log("Start");

    setTimeout(() => {
      console.log("Timeout");
    }, 0);

    Promise.resolve().then(() => {
      console.log("Promise");
    });

    console.log("End");

    Output:
    Start
    End
    Promise
    Timeout

✔️ Why This Matters
    • Enables non-blocking behavior
    • Makes Node.js scalable
    • Helps in handling thousands of requests

✔️ Bonus Tip (Advanced Insight)
You can say: "The event loop has different phases like timers, I/O callbacks, idle, poll, check, and close callbacks."
(You don't need deep detail unless asked)`
      },
      {
        category: "async",
        question: "(Basic → Important) — What is the difference between synchronous and asynchronous code?",
        definition: `In Node.js, synchronous code blocks the execution of the program until a task is completed, which can reduce performance.
Asynchronous code, on the other hand, allows tasks like file reading, API calls, or database operations to run in the background,

This non-blocking behavior improves scalability and performance.

🔴 Synchronous
    const data = fs.readFileSync("file.txt");
    console.log(data);
    console.log("Done");
    // Execution waits until file is read

🟢 Asynchronous
    fs.readFile("file.txt", (err, data) => {

    });
    console.log("Done");
    // Output: Done
    //         (file content later)

✔️ Key Differences
    | Feature     | Synchronous   | Asynchronous
    |-------------|---------------|-------------

    | Performance | Slower        | Faster
    | Use Case    | Simple tasks  | I/O operations

    // =========================================================
    // 3) STATE + PERSISTENCE
    // =========================================================
    const REVISED_KEY = "nodeRevision_revisedIds";
    const THEME_KEY = "nodeRevision_theme";

    const items = nodeQuestions
      .map((item, i) => ({ ...item, id: "q" + i }))
      .filter(item => (item.question || "").trim() || (item.definition || "").trim());

    let revisedIds = new Set(JSON.parse(localStorage.getItem(REVISED_KEY) || "[]"));
    let expandedIds = new Set();
    let activeCategory = "all";
    let onlyPending = false;
    let searchTerm = "";

    function saveRevised() {
      localStorage.setItem(REVISED_KEY, JSON.stringify([...revisedIds]));
    }

    // =========================================================
    // 4) TEXT FORMATTING (escape + lightweight highlighting)
    // =========================================================
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatDefinition(raw) {
      const escaped = escapeHtml(raw);
      const lines = escaped.split("\n");
      const markerMap = [
        [/^(\s*)(✔️|✅)/, "l-good"],
        [/^(\s*)(❌)/, "l-bad"],
        [/^(\s*)(🔴)/, "l-bad"],
        [/^(\s*)(🟢)/, "l-good"],
        [/^(\s*)(👉)/, "l-note"],
        [/^(\s*)(⚠️)/, "l-warn"],
      ];
      const out = lines.map(line => {
        for (const [regex, cls] of markerMap) {
          if (regex.test(line)) return `<span class="${cls}">${line}</span>`;
        }
        return line.replace(/(Definition:)/i, "<strong>$1</strong>");
      });
      return out.join("\n");
    }

    // =========================================================
    // 5) RENDER
    // =========================================================
    const categoryChipsEl = document.getElementById("categoryChips");
    const questionListEl = document.getElementById("questionList");
    const noResultsEl = document.getElementById("noResults");
    const progressFillEl = document.getElementById("progressFill");
    const progressLabelEl = document.getElementById("progressLabel");
    const subtitleEl = document.getElementById("subtitle");

    function categoryMeta(id) {
      return CATEGORIES.find(c => c.id === id) || { label: id, color: "#8b96ad" };
    }

    function renderChips() {
      const counts = { all: items.length };
      CATEGORIES.forEach(c => counts[c.id] = 0);
      items.forEach(it => { counts[it.category] = (counts[it.category] || 0) + 1; });

      const chips = [{ id: "all", label: "All", color: "#8b96ad" }, ...CATEGORIES];
      categoryChipsEl.innerHTML = chips.map(c => `
        <button class="chip ${activeCategory === c.id ? "active" : ""}" data-cat="${c.id}" type="button">
          <span class="dot" style="background:${c.color}"></span>
          ${c.label} <span class="count">${counts[c.id] || 0}</span>
        </button>
      `).join("");

      categoryChipsEl.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          renderChips();
          renderList();
        });
      });
    }

    function matchesFilters(item) {
      const term = searchTerm.trim().toLowerCase();
      const matchesSearch = !term ||
        item.question.toLowerCase().includes(term) ||
        item.definition.toLowerCase().includes(term);
      const matchesCategory = activeCategory === "all" || item.category === activeCategory;
      const matchesPending = !onlyPending || !revisedIds.has(item.id);
      return matchesSearch && matchesCategory && matchesPending;
    }

    function renderList() {
      const visible = items.filter(matchesFilters);
      questionListEl.innerHTML = "";
      noResultsEl.hidden = visible.length > 0;

      const grouped = {};
      visible.forEach(it => {
        if (!grouped[it.category]) grouped[it.category] = [];
        grouped[it.category].push(it);
      });

      const orderedCatIds = CATEGORIES.map(c => c.id).filter(id => grouped[id]?.length);

      orderedCatIds.forEach(catId => {
        const meta = categoryMeta(catId);
        const section = document.createElement("section");
        section.className = "category-section";
        section.innerHTML = `
          <h2 class="category-heading">
            <span class="dot" style="background:${meta.color}"></span>
            ${meta.label} <span class="cat-count">(${grouped[catId].length})</span>
          </h2>
        `;

        grouped[catId].forEach(item => {
          const overallIndex = items.indexOf(item) + 1;
          const isOpen = expandedIds.has(item.id) || searchTerm.trim().length > 0;
          const isRevised = revisedIds.has(item.id);

          const card = document.createElement("article");
          card.className = `card ${isOpen ? "open" : ""} ${isRevised ? "revised" : ""}`;
          card.dataset.id = item.id;
          card.innerHTML = `
            <button class="card-header" type="button" aria-expanded="${isOpen}">
              <span class="q-index">Q${overallIndex}</span>
              <span class="q-text">${escapeHtml(item.question)}</span>
              <span class="revised-dot" title="${isRevised ? "Revised" : "Not revised"}"></span>
              <span class="chevron">▾</span>
            </button>
            <div class="card-body" ${isOpen ? "" : "hidden"}>
              <pre class="definition">${formatDefinition(item.definition)}</pre>
              <div class="card-footer">
                <label class="revised-toggle">
                  <input type="checkbox" class="revised-checkbox" ${isRevised ? "checked" : ""} />
                  Mark as revised
                </label>
                <span class="category-tag">${meta.label}</span>
              </div>
            </div>
          `;

          const headerBtn = card.querySelector(".card-header");
          const bodyEl = card.querySelector(".card-body");
          headerBtn.addEventListener("click", () => {
            const nowOpen = bodyEl.hasAttribute("hidden");
            if (nowOpen) {
              bodyEl.removeAttribute("hidden");
              expandedIds.add(item.id);
              card.classList.add("open");
            } else {
              bodyEl.setAttribute("hidden", "");
              expandedIds.delete(item.id);
              card.classList.remove("open");
            }
            headerBtn.setAttribute("aria-expanded", String(nowOpen));
          });

          const checkbox = card.querySelector(".revised-checkbox");
          checkbox.addEventListener("click", e => e.stopPropagation());
          checkbox.addEventListener("change", () => {
            if (checkbox.checked) {
              revisedIds.add(item.id);
            } else {
              revisedIds.delete(item.id);
            }
            saveRevised();
            card.classList.toggle("revised", checkbox.checked);
            renderChips();
            updateProgress();
          });

          section.appendChild(card);
        });

        questionListEl.appendChild(section);
      });
    }

    function updateProgress() {
      const total = items.length;
      const done = items.filter(it => revisedIds.has(it.id)).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      progressFillEl.style.width = pct + "%";
      progressLabelEl.textContent = `${done} / ${total} revised (${pct}%)`;
      subtitleEl.textContent = `${total} questions across ${CATEGORIES.filter(c => items.some(it => it.category === c.id)).length} categories`;
    }

    // =========================================================
    // 6) CONTROLS WIRING
    // =========================================================
    document.getElementById("searchInput").addEventListener("input", e => {
      searchTerm = e.target.value;
      renderList();
    });

    document.getElementById("onlyPending").addEventListener("change", e => {
      onlyPending = e.target.checked;
      renderList();
    });

    document.getElementById("expandAllBtn").addEventListener("click", () => {
      items.filter(matchesFilters).forEach(it => expandedIds.add(it.id));
      renderList();
    });

    document.getElementById("collapseAllBtn").addEventListener("click", () => {
      items.filter(matchesFilters).forEach(it => expandedIds.delete(it.id));
      renderList();
    });

    // =========================================================
    // 7) BACK TO TOP
    // =========================================================
    const backToTopBtn = document.getElementById("backToTopBtn");
    window.addEventListener("scroll", () => {
      backToTopBtn.style.display = (window.scrollY > 300) ? "block" : "none";
    });
    backToTopBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

    // =========================================================
    // 8) THEME TOGGLE
    // =========================================================
    const themeToggle = document.getElementById("themeToggle");
    const body = document.body;

    function enableLightMode(save = true) {
      body.classList.add("light-mode");
      themeToggle.innerHTML = "🌙 Dark";
      if (save) localStorage.setItem(THEME_KEY, "light");
    }
    function enableDarkMode(save = true) {
      body.classList.remove("light-mode");
      themeToggle.innerHTML = "☀️ Light";
      if (save) localStorage.setItem(THEME_KEY, "dark");
    }
    if (localStorage.getItem(THEME_KEY) === "light") {
      enableLightMode(false);
    } else {
      enableDarkMode(false);
    }
    themeToggle.addEventListener("click", () => {
      body.classList.contains("light-mode") ? enableDarkMode() : enableLightMode();
    });

    // =========================================================
    // 9) INIT
    // =========================================================
    renderChips();
    renderList();
    updateProgress();
  </script>
</body>
